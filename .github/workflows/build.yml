name: Build Neer Zen APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Repository
        run: |
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Scaffold Neer Android Project (Impeccable UI/UX Pro Max Architecture)
        run: |
          python3 - << 'PYEOF'
          import os, textwrap

          def write_file(path, content):
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_file("settings.gradle.kts", """
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "Neer"
              include(":app")
          """)

          write_file("build.gradle.kts", """
              plugins {
                  id("com.android.application") version "8.4.0" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.23" apply false
              }
          """)

          write_file("gradle.properties", """
              org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          write_file("app/build.gradle.kts", """
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }

              android {
                  namespace = "com.zen.neer"
                  compileSdk = 34

                  defaultConfig {
                      applicationId = "com.zen.neer"
                      minSdk = 26
                      targetSdk = 34
                      versionCode = 3
                      versionName = "1.2"
                  }

                  buildTypes {
                      release {
                          isMinifyEnabled = false
                      }
                  }
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
                  buildFeatures {
                      compose = true
                  }
                  composeOptions {
                      kotlinCompilerExtensionVersion = "1.5.13"
                  }
              }

              dependencies {
                  val composeBom = platform("androidx.compose:compose-bom:2024.05.00")
                  implementation(composeBom)
                  implementation("androidx.core:core-ktx:1.13.1")
                  implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")
                  implementation("androidx.activity:activity-compose:1.9.0")
                  implementation("androidx.compose.ui:ui")
                  implementation("androidx.compose.ui:ui-graphics")
                  implementation("androidx.compose.material3:material3")
                  implementation("androidx.compose.material:material-icons-extended")
              }
          """)

          write_file("app/src/main/res/values/strings.xml", """
              <resources>
                  <string name="app_name">Neer</string>
              </resources>
          """)

          write_file("app/src/main/res/drawable/ic_launcher_background.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path android:fillColor="#F5F2EB" android:pathData="M0,0h108v108h-108z" />
              </vector>
          """)

          write_file("app/src/main/res/drawable/ic_launcher_foreground.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path android:strokeColor="#3A4F41" android:strokeWidth="5.5" android:strokeLineCap="round"
                      android:pathData="M78,36 C86,48 84,66 72,76 C58,87 38,84 28,70 C19,56 23,36 38,27 C50,20 65,22 73,29" />
                  <path android:fillColor="#B5654D"
                      android:pathData="M79,27 C79,29.5 77,31.5 74.5,31.5 C72,31.5 70,29.5 70,27 C70,24 74.5,19 74.5,19 C74.5,19 79,24 79,27 Z" />
                  <path android:strokeColor="#232924" android:strokeWidth="4.2" android:strokeLineCap="round" android:strokeLineJoin="round"
                      android:pathData="M39,46 L39,66 M39,46 L55,46 L55,64 C55,68 62,68 64,62 M39,46 C37,36 48,30 58,35 C65,38 64,45 56,46" />
              </vector>
          """)

          write_file("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@drawable/ic_launcher_background" />
                  <foreground android:drawable="@drawable/ic_launcher_foreground" />
              </adaptive-icon>
          """)

          write_file("app/src/main/AndroidManifest.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.VIBRATE" />
                  <application
                      android:allowBackup="true"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher"
                      android:label="@string/app_name"
                      android:supportsRtl="true"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          """)

          write_file("app/src/main/java/com/zen/neer/MainActivity.kt", """
              package com.zen.neer

              import android.content.Context
              import android.media.AudioManager
              import android.media.ToneGenerator
              import android.os.Build
              import android.os.Bundle
              import android.os.VibrationEffect
              import android.os.Vibrator
              import androidx.activity.ComponentActivity
              import androidx.activity.compose.setContent
              import androidx.compose.animation.AnimatedVisibility
              import androidx.compose.animation.fadeIn
              import androidx.compose.animation.fadeOut
              import androidx.compose.animation.core.*
              import androidx.compose.foundation.Canvas
              import androidx.compose.foundation.background
              import androidx.compose.foundation.clickable
              import androidx.compose.foundation.layout.*
              import androidx.compose.foundation.lazy.LazyColumn
              import androidx.compose.foundation.lazy.items
              import androidx.compose.foundation.shape.CircleShape
              import androidx.compose.foundation.shape.RoundedCornerShape
              import androidx.compose.material.icons.Icons
              import androidx.compose.material.icons.filled.MenuBook
              import androidx.compose.material.icons.filled.SelfImprovement
              import androidx.compose.material.icons.filled.Spa
              import androidx.compose.material.icons.filled.WaterDrop
              import androidx.compose.material3.*
              import androidx.compose.runtime.*
              import androidx.compose.ui.Alignment
              import androidx.compose.ui.Modifier
              import androidx.compose.ui.draw.clip
              import androidx.compose.ui.geometry.Offset
              import androidx.compose.ui.geometry.Size
              import androidx.compose.ui.graphics.Brush
              import androidx.compose.ui.graphics.Color
              import androidx.compose.ui.graphics.Path
              import androidx.compose.ui.graphics.StrokeCap
              import androidx.compose.ui.graphics.drawscope.Stroke
              import androidx.compose.ui.platform.LocalContext
              import androidx.compose.ui.semantics.Role
              import androidx.compose.ui.semantics.contentDescription
              import androidx.compose.ui.semantics.role
              import androidx.compose.ui.semantics.semantics
              import androidx.compose.ui.text.font.FontFamily
              import androidx.compose.ui.text.font.FontStyle
              import androidx.compose.ui.text.font.FontWeight
              import androidx.compose.ui.text.style.TextAlign
              import androidx.compose.ui.unit.dp
              import androidx.compose.ui.unit.sp
              import kotlinx.coroutines.delay
              import kotlin.math.sin

              // Wabi-Sabi Impeccable Color Theory & Accessible Contrast Ratios
              val PaperBg = Color(0xFFF5F2EB)        // Handmade unbleached Washi paper
              val ClaySurface = Color(0xFFEBE5D8)    // Soft earthen stone surface
              val BrushInk = Color(0xFF232924)       // Deep Sumi ink (AAA contrast on paper)
              val ZenMoss = Color(0xFF3A4F41)        // Forest leaf & active ink accent
              val MistSage = Color(0xFF8A9B8E)       // Muted secondary stroke
              val Terracotta = Color(0xFFB5654D)     // Hanko seal & alert accent
              val MutedInk = Color(0xFF5A635E)       // Accessible secondary body text

              enum class SipState { IDLE, DRINKING_12S, STILLNESS_SEAL }

              data class HerbalWater(
                  val name: String,
                  val tamilName: String,
                  val tagline: String,
                  val mindBodyBenefit: String,
                  val ingredients: String,
                  val method: String,
                  val bestTime: String,
                  val steepMinutes: Int
              )

              val ayurvedicManual = listOf(
                  HerbalWater(
                      name = "Jeera Water",
                      tamilName = "சீரகத் தண்ணீர் • Seeraga Neer",
                      tagline = "Digestive Agni & Mental Clarity",
                      mindBodyBenefit = "Clears gut sluggishness that triggers afternoon brain fog. Warm cumin infusion relaxes the nervous system and grounds scattered thoughts.",
                      ingredients = "1 tsp whole Cumin seeds (Seeragam) + 500ml water",
                      method = "Simmer water with cumin seeds on low flame for 5 minutes until golden. Cover, let steep for 5 minutes, and sip warm.",
                      bestTime = "Warm in the morning or 20 mins after lunch",
                      steepMinutes = 5
                  ),
                  HerbalWater(
                      name = "Vendhaya Water",
                      tamilName = "வெந்தயத் தண்ணீர் • Vendhaya Neer",
                      tagline = "Deep Body-Heat (Pitta) Cooling & Glycemic Calm",
                      mindBodyBenefit = "Excess internal heat causes irritability and eye strain. Soaked fenugreek cools the digestive tract and steadies morning energy.",
                      ingredients = "1 tsp Fenugreek seeds (Vendhayam) + 1 glass room-temp water",
                      method = "Soak fenugreek seeds in a clay or steel tumbler overnight. Drink the cool golden water slowly on an empty stomach.",
                      bestTime = "First thing upon waking",
                      steepMinutes = 10
                  ),
                  HerbalWater(
                      name = "Omam Water",
                      tamilName = "ஓமத் தண்ணீர் • Oma Neer",
                      tagline = "Vata Grounding & Breath Expansion",
                      mindBodyBenefit = "Trapped air (Vata) causes both bloating and racing thoughts. Warm Omam water releases abdominal tension and deepens shallow breathing.",
                      ingredients = "1/2 tsp lightly roasted Ajwain (Omam) + 400ml water",
                      method = "Dry roast omam for 30 seconds until fragrant, add water, and boil for 4 minutes. Strain and sip warm.",
                      bestTime = "Mid-afternoon or after a heavy meal",
                      steepMinutes = 4
                  ),
                  HerbalWater(
                      name = "Sombu (Fennel) Water",
                      tamilName = "சோம்புத் தண்ணீர் • Sombu Neer",
                      tagline = "Evening Nervous System Unwind",
                      mindBodyBenefit = "Naturally sweet and Sattvic. Fennel releases tight jaw and shoulder tension accumulated from screen hours.",
                      ingredients = "1 tsp Fennel seeds (Sombu) + 500ml hot water",
                      method = "Steep fennel seeds in hot boiled water with a lid on for 7 minutes. Sip slowly as your workday winds down.",
                      bestTime = "Late afternoon transition (5:30 PM)",
                      steepMinutes = 7
                  ),
                  HerbalWater(
                      name = "Vettiver Clay Pot Water",
                      tamilName = "வெட்டிவேர் தண்ணீர் • Vettiver Neer",
                      tagline = "Earthy Anxiety Relief & Sensory Quiet",
                      mindBodyBenefit = "The petrichor aroma of Vettiver roots calms the limbic system, washing away urban noise and screen fatigue.",
                      ingredients = "A small washed bundle of Vettiver roots + 1 Litre water",
                      method = "Place clean Vettiver roots in a clay pot or steel jug for 2+ hours. Naturally cool and aromatic without refrigeration.",
                      bestTime = "Sip through warm afternoons",
                      steepMinutes = 15
                  )
              )

              class MainActivity : ComponentActivity() {
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContent {
                          MaterialTheme(
                              colorScheme = lightColorScheme(
                                  background = PaperBg,
                                  surface = ClaySurface,
                                  primary = ZenMoss,
                                  secondary = Terracotta,
                                  onBackground = BrushInk,
                                  onSurface = BrushInk
                              )
                          ) {
                              NeerApp()
                          }
                      }
                  }
              }

              @Composable
              fun NeerApp() {
                  val context = LocalContext.current
                  val prefs = remember { context.getSharedPreferences("neer_zen_prefs", Context.MODE_PRIVATE) }
                  var pebblesToday by remember { mutableStateOf(prefs.getInt("pebbles_count", 0)) }
                  var selectedTab by remember { mutableStateOf(0) }

                  fun addZenPebble() {
                      pebblesToday += 1
                      prefs.edit().putInt("pebbles_count", pebblesToday).apply()
                  }

                  Scaffold(
                      containerColor = PaperBg,
                      bottomBar = {
                          NavigationBar(
                              containerColor = ClaySurface,
                              tonalElevation = 3.dp,
                              modifier = androidx.compose.ui.Modifier.height(72.dp)
                          ) {
                              NavigationBarItem(
                                  selected = selectedTab == 0,
                                  onClick = { selectedTab = 0 },
                                  icon = { Icon(Icons.Default.WaterDrop, contentDescription = null, modifier = Modifier.size(24.dp)) },
                                  label = { Text("நீர் • Sip", fontFamily = FontFamily.Serif, fontSize = 12.sp) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = ZenMoss,
                                      selectedTextColor = ZenMoss,
                                      indicatorColor = MistSage.copy(alpha = 0.3f)
                                  )
                              )
                              NavigationBarItem(
                                  selected = selectedTab == 1,
                                  onClick = { selectedTab = 1 },
                                  icon = { Icon(Icons.Default.SelfImprovement, contentDescription = null, modifier = Modifier.size(24.dp)) },
                                  label = { Text("Focus Pot", fontFamily = FontFamily.Serif, fontSize = 12.sp) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = ZenMoss,
                                      selectedTextColor = ZenMoss,
                                      indicatorColor = MistSage.copy(alpha = 0.3f)
                                  )
                              )
                              NavigationBarItem(
                                  selected = selectedTab == 2,
                                  onClick = { selectedTab = 2 },
                                  icon = { Icon(Icons.Default.MenuBook, contentDescription = null, modifier = Modifier.size(24.dp)) },
                                  label = { Text("Infusions", fontFamily = FontFamily.Serif, fontSize = 12.sp) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = ZenMoss,
                                      selectedTextColor = ZenMoss,
                                      indicatorColor = MistSage.copy(alpha = 0.3f)
                                  )
                              )
                          }
                      }
                  ) { padding ->
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(padding)
                      ) {
                          when (selectedTab) {
                              0 -> NeerBrushSipScreen(
                                  pebblesCount = pebblesToday,
                                  onCompleteSip = { addZenPebble() },
                                  onResetDay = {
                                      pebblesToday = 0
                                      prefs.edit().putInt("pebbles_count", 0).apply()
                                  }
                              )
                              1 -> FocusVesselScreen(onFocusSipCompleted = { addZenPebble() })
                              2 -> AyurvedicManualScreen()
                          }
                      }
                  }
              }

              // =========================================================================
              // SCREEN 1: NEER SUMI-E 12s BRUSH TIMER & GARDEN CANVAS (A11y & Grid Aligned)
              // =========================================================================
              @Composable
              fun NeerBrushSipScreen(
                  pebblesCount: Int,
                  onCompleteSip: () -> Unit,
                  onResetDay: () -> Unit
              ) {
                  val context = LocalContext.current
                  var sipState by remember { mutableStateOf(SipState.IDLE) }
                  var progress12s by remember { mutableStateOf(0f) }
                  var sealRippleProgress by remember { mutableStateOf(0f) }
                  var phaseText by remember { mutableStateOf("Hold your glass. Tap canvas to begin sip.") }
                  var subPhaseText by remember { mutableStateOf("12 seconds of unhurried breath and hydration.") }

                  val reflections = remember {
                      listOf(
                          "Notice the coolness in your throat before you pick up your next thought.",
                          "Let your shoulders drop an inch lower than they were a minute ago.",
                          "Unclench your jaw. Even a sip of water is a small sanctuary.",
                          "நீர் இன்றி அமையாது உலகு — Without water, there is no life, nor stillness."
                      )
                  }
                  var reflectionIndex by remember { mutableStateOf(0) }

                  LaunchedEffect(sipState) {
                      when (sipState) {
                          SipState.IDLE -> {
                              progress12s = 0f
                              sealRippleProgress = 0f
                              phaseText = "Hold your glass. Tap canvas to begin sip."
                              subPhaseText = "12 seconds of unhurried breath and hydration."
                          }
                          SipState.DRINKING_12S -> {
                              triggerGentleHaptic(context, 35)
                              val totalSteps = 120
                              for (step in 1..totalSteps) {
                                  progress12s = step / totalSteps.toFloat()
                                  when (step) {
                                      1 -> {
                                          phaseText = "Breathe in gently... lift your glass"
                                          subPhaseText = "First 4 seconds • Settle your posture"
                                      }
                                      40 -> {
                                          triggerGentleHaptic(context, 45)
                                          phaseText = "Take slow, unhurried sips..."
                                          subPhaseText = "Middle 4 seconds • Feel the temperature of Neer"
                                      }
                                      80 -> {
                                          triggerGentleHaptic(context, 45)
                                          phaseText = "Swallow & exhale softly through your nose..."
                                          subPhaseText = "Final 4 seconds • Let your shoulders drop"
                                      }
                                  }
                                  delay(100L)
                              }
                              triggerGentleHaptic(context, 90)
                              playSoftZenBell()
                              sipState = SipState.STILLNESS_SEAL
                          }
                          SipState.STILLNESS_SEAL -> {
                              phaseText = "Set your glass down. Stay still for one breath..."
                              subPhaseText = "Let the ripple settle before returning to your work."
                              val rippleSteps = 35
                              for (r in 1..rippleSteps) {
                                  sealRippleProgress = r / rippleSteps.toFloat()
                                  delay(100L)
                              }
                              onCompleteSip()
                              reflectionIndex = (reflectionIndex + 1) % reflections.size
                              sipState = SipState.IDLE
                          }
                      }
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(horizontal = 24.dp, vertical = 16.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      // Top Header (Typography Scaling & Hierarchy)
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(
                              text = "நீர் • NEER",
                              fontSize = 14.sp,
                              letterSpacing = 4.sp,
                              color = ZenMoss,
                              fontWeight = FontWeight.Bold
                          )
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              text = "Sum-e Canvas Sanctuary",
                              fontSize = 13.sp,
                              fontFamily = FontFamily.Serif,
                              fontStyle = FontStyle.Italic,
                              color = MutedInk
                          )
                      }

                      // Centerpiece: Pure Sumi-e Enso Brush Canvas (Min 48dp Touch Target & Semantics)
                      Box(
                          contentAlignment = Alignment.Center,
                          modifier = Modifier
                              .size(280.dp)
                              .semantics {
                                  role = Role.Button
                                  contentDescription = "Tap to begin 12 second mindful sip ritual"
                              }
                              .clickable(enabled = sipState == SipState.IDLE) {
                                  sipState = SipState.DRINKING_12S
                              }
                      ) {
                          Canvas(modifier = Modifier.fillMaxSize()) {
                              val center = Offset(size.width / 2, size.height / 2)
                              val radius = size.minDimension / 2.6f

                              // Dry-brush background track
                              drawArc(
                                  color = MistSage.copy(alpha = 0.28f),
                                  startAngle = -90f,
                                  sweepAngle = 335f,
                                  useCenter = false,
                                  topLeft = Offset(center.x - radius, center.y - radius),
                                  size = Size(radius * 2, radius * 2),
                                  style = Stroke(width = 20f, cap = StrokeCap.Round)
                              )

                              val activeSweep = when (sipState) {
                                  SipState.IDLE -> 335f * 0.15f
                                  SipState.DRINKING_12S -> 335f * progress12s
                                  SipState.STILLNESS_SEAL -> 335f
                              }

                              // Wet Sumi Ink Brush Stroke
                              drawArc(
                                  color = ZenMoss,
                                  startAngle = -90f,
                                  sweepAngle = activeSweep,
                                  useCenter = false,
                                  topLeft = Offset(center.x - radius, center.y - radius),
                                  size = Size(radius * 2, radius * 2),
                                  style = Stroke(width = 16f, cap = StrokeCap.Round)
                              )

                              // Stillness Ripple Seal at end of ritual
                              if (sipState == SipState.STILLNESS_SEAL) {
                                  val rippleRadius1 = radius * (0.3f + sealRippleProgress * 0.95f)
                                  val alpha = (1f - sealRippleProgress).coerceIn(0f, 1f)
                                  drawCircle(
                                      color = Terracotta.copy(alpha = alpha * 0.6f),
                                      radius = rippleRadius1,
                                      center = center,
                                      style = Stroke(width = 3.5f)
                                  )
                              }
                          }

                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              when (sipState) {
                                  SipState.IDLE -> {
                                      Text(
                                          text = "TAP CANVAS",
                                          fontSize = 12.sp,
                                          letterSpacing = 3.sp,
                                          fontWeight = FontWeight.Bold,
                                          color = Terracotta
                                      )
                                      Spacer(modifier = Modifier.height(4.dp))
                                      Text(
                                          text = "To Begin Sip",
                                          fontSize = 13.sp,
                                          fontFamily = FontFamily.Serif,
                                          color = BrushInk
                                      )
                                  }
                                  SipState.DRINKING_12S -> {
                                      val secsLeft = 12 - (progress12s * 12).toInt()
                                      Text(
                                          text = "${secsLeft}s",
                                          fontSize = 32.sp,
                                          fontFamily = FontFamily.Serif,
                                          fontWeight = FontWeight.Bold,
                                          color = ZenMoss
                                      )
                                      Text(
                                          text = "Sip Slowly",
                                          fontSize = 12.sp,
                                          color = MutedInk
                                      )
                                  }
                                  SipState.STILLNESS_SEAL -> {
                                      Text(
                                          text = "Stillness",
                                          fontSize = 18.sp,
                                          fontFamily = FontFamily.Serif,
                                          fontStyle = FontStyle.Italic,
                                          color = Terracotta
                                      )
                                  }
                              }
                          }
                      }

                      // Bottom Action & Zen Garden Reflection Card (8dp Grid Spacing)
                      Column(
                          horizontalAlignment = Alignment.CenterHorizontally,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(
                              text = phaseText,
                              fontSize = 15.sp,
                              fontFamily = FontFamily.Serif,
                              fontWeight = FontWeight.SemiBold,
                              color = BrushInk,
                              textAlign = TextAlign.Center
                          )
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              text = subPhaseText,
                              fontSize = 12.sp,
                              color = MutedInk,
                              textAlign = TextAlign.Center
                          )

                          Spacer(modifier = Modifier.height(12.dp))

                          if (sipState == SipState.IDLE) {
                              Button(
                                  onClick = { sipState = SipState.DRINKING_12S },
                                  colors = ButtonDefaults.buttonColors(containerColor = ZenMoss),
                                  shape = RoundedCornerShape(24.dp),
                                  modifier = Modifier
                                      .fillMaxWidth(0.7f)
                                      .height(48.dp) // Accessible Min Height
                              ) {
                                  Text(
                                      text = "Start 12s Mindful Sip",
                                      fontFamily = FontFamily.Serif,
                                      fontSize = 15.sp,
                                      color = PaperBg
                                  )
                              }
                          } else if (sipState == SipState.DRINKING_12S) {
                              TextButton(
                                  onClick = { sipState = SipState.IDLE },
                                  modifier = Modifier.height(48.dp)
                              ) {
                                  Text("Cancel", color = MutedInk, fontSize = 13.sp)
                              }
                          } else {
                              Spacer(modifier = Modifier.height(48.dp))
                          }

                          Spacer(modifier = Modifier.height(12.dp))

                          Card(
                              colors = CardDefaults.cardColors(containerColor = ClaySurface),
                              shape = RoundedCornerShape(16.dp),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Column(
                                  modifier = Modifier.padding(14.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text(
                                      text = "“${reflections[reflectionIndex]}”",
                                      fontSize = 12.sp,
                                      fontFamily = FontFamily.Serif,
                                      fontStyle = FontStyle.Italic,
                                      textAlign = TextAlign.Center,
                                      color = BrushInk
                                  )
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.Center,
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      Text(
                                          text = "River Stones Today: ",
                                          fontSize = 11.sp,
                                          color = MutedInk
                                      )
                                      Text(
                                          text = "$pebblesCount",
                                          fontSize = 13.sp,
                                          fontWeight = FontWeight.Bold,
                                          color = ZenMoss
                                      )
                                      if (pebblesCount > 0) {
                                          Spacer(modifier = Modifier.width(8.dp))
                                          Text(
                                              text = "Clear",
                                              fontSize = 11.sp,
                                              color = Terracotta,
                                              modifier = Modifier
                                                  .clickable { onResetDay() }
                                                  .semantics { role = Role.Button }
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              // =========================================================================
              // SCREEN 2: FOCUS VESSEL (Bamboo Rocker / Shishi-odoshi)
              // =========================================================================
              @Composable
              fun FocusVesselScreen(onFocusSipCompleted: () -> Unit) {
                  val context = LocalContext.current
                  var selectedMinutes by remember { mutableStateOf(25) }
                  var remainingSeconds by remember { mutableStateOf(25 * 60) }
                  var isRunning by remember { mutableStateOf(false) }
                  var sessionComplete by remember { mutableStateOf(false) }

                  LaunchedEffect(isRunning, remainingSeconds) {
                      if (isRunning && remainingSeconds > 0) {
                          delay(1000L)
                          remainingSeconds -= 1
                          if (remainingSeconds == 0) {
                              isRunning = false
                              sessionComplete = true
                              triggerGentleHaptic(context, 200)
                              playSoftZenBell()
                          }
                      }
                  }

                  val totalSeconds = selectedMinutes * 60
                  val fillFraction = if (totalSeconds > 0) ((totalSeconds - remainingSeconds).toFloat() / totalSeconds.toFloat()).coerceIn(0f, 1f) else 0f

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(24.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(
                              text = "BAMBOO FOCUS VESSEL",
                              fontSize = 12.sp,
                              letterSpacing = 3.sp,
                              color = MutedInk,
                              fontWeight = FontWeight.Medium
                          )
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              text = "Work in silence. Hydrate when focus completes.",
                              fontSize = 14.sp,
                              fontFamily = FontFamily.Serif,
                              fontStyle = FontStyle.Italic,
                              color = MutedInk,
                              textAlign = TextAlign.Center
                          )
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          listOf(15, 25, 45).forEach { mins ->
                              FilterChip(
                                  selected = selectedMinutes == mins && !isRunning,
                                  onClick = {
                                      if (!isRunning) {
                                          selectedMinutes = mins
                                          remainingSeconds = mins * 60
                                          sessionComplete = false
                                      }
                                  },
                                  label = { Text("$mins min", fontFamily = FontFamily.Serif) },
                                  colors = FilterChipDefaults.filterChipColors(
                                      selectedContainerColor = ZenMoss,
                                      selectedLabelColor = PaperBg
                                  )
                              )
                          }
                      }

                      // Visualizing Shishi-odoshi fill progress
                      Box(
                          contentAlignment = Alignment.Center,
                          modifier = Modifier
                              .size(220.dp)
                              .clip(CircleShape)
                              .background(ClaySurface)
                      ) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              val mins = remainingSeconds / 60
                              val secs = remainingSeconds % 60
                              Text(
                                  text = String.format("%02d:%02d", mins, secs),
                                  fontSize = 36.sp,
                                  fontFamily = FontFamily.Serif,
                                  fontWeight = FontWeight.Bold,
                                  color = BrushInk
                              )
                              Spacer(modifier = Modifier.height(4.dp))
                              Text(
                                  text = if (isRunning) "Focus Active..." else if (sessionComplete) "Vessel Full" else "Ready",
                                  fontSize = 12.sp,
                                  color = MutedInk
                              )
                              Spacer(modifier = Modifier.height(8.dp))
                              LinearProgressIndicator(
                                  progress = { fillFraction },
                                  modifier = Modifier
                                      .width(100.dp)
                                      .height(6.dp)
                                      .clip(RoundedCornerShape(3.dp)),
                                  color = ZenMoss,
                                  trackColor = MistSage.copy(alpha = 0.3f),
                              )
                          }
                      }

                      if (sessionComplete) {
                          Card(
                              colors = CardDefaults.cardColors(containerColor = ZenMoss),
                              shape = RoundedCornerShape(16.dp),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Column(
                                  modifier = Modifier.padding(18.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text(
                                      text = "Time to Step Back & Sip",
                                      color = PaperBg,
                                      fontWeight = FontWeight.Bold,
                                      fontFamily = FontFamily.Serif,
                                      fontSize = 16.sp
                                  )
                                  Spacer(modifier = Modifier.height(6.dp))
                                  Text(
                                      text = "Take a mindful break, rest your eyes, and drink a calm glass of water.",
                                      color = PaperBg.copy(alpha = 0.9f),
                                      fontSize = 12.sp,
                                      textAlign = TextAlign.Center
                                  )
                                  Spacer(modifier = Modifier.height(12.dp))
                                  Button(
                                      onClick = {
                                          onFocusSipCompleted()
                                          sessionComplete = false
                                          remainingSeconds = selectedMinutes * 60
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = Terracotta),
                                      modifier = Modifier.height(48.dp)
                                  ) {
                                      Text("Complete Mindful Break", color = PaperBg)
                                  }
                              }
                          }
                      } else {
                          Row(horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                              Button(
                                  onClick = { isRunning = !isRunning },
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = if (isRunning) Terracotta else ZenMoss
                                  ),
                                  shape = RoundedCornerShape(24.dp),
                                  modifier = Modifier
                                      .height(48.dp)
                                      .weight(1f)
                              ) {
                                  Text(
                                      text = if (isRunning) "Pause" else "Start Focus Pot",
                                      fontFamily = FontFamily.Serif,
                                      fontSize = 15.sp,
                                      color = PaperBg
                                  )
                              }
                              if (!isRunning && remainingSeconds != selectedMinutes * 60) {
                                  OutlinedButton(
                                      onClick = { remainingSeconds = selectedMinutes * 60 },
                                      shape = RoundedCornerShape(24.dp),
                                      modifier = Modifier.height(48.dp)
                                  ) {
                                      Text("Reset", color = BrushInk)
                                  }
                              }
                          }
                      }
                  }
              }

              // =========================================================================
              // SCREEN 3: HERBAL INFUSIONS APOTHECARY SCROLL
              // =========================================================================
              @Composable
              fun AyurvedicManualScreen() {
                  val context = LocalContext.current
                  var activeSteepName by remember { mutableStateOf<String?>(null) }
                  var steepSecondsLeft by remember { mutableStateOf(0) }

                  LaunchedEffect(steepSecondsLeft) {
                      if (steepSecondsLeft > 0) {
                          delay(1000L)
                          steepSecondsLeft -= 1
                          if (steepSecondsLeft == 0) {
                              triggerGentleHaptic(context, 180)
                              playSoftZenBell()
                          }
                      }
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(horizontal = 20.dp, vertical = 16.dp)
                  ) {
                      Text(
                          text = "HERBAL WATER MANUAL",
                          fontSize = 12.sp,
                          letterSpacing = 3.sp,
                          color = MutedInk,
                          fontWeight = FontWeight.Medium
                      )
                      Spacer(modifier = Modifier.height(4.dp))
                      Text(
                          text = "Traditional Infusions for Gut & Mind",
                          fontSize = 18.sp,
                          fontFamily = FontFamily.Serif,
                          fontWeight = FontWeight.Bold,
                          color = BrushInk
                      )
                      Spacer(modifier = Modifier.height(12.dp))

                      AnimatedVisibility(visible = steepSecondsLeft > 0, enter = fadeIn(), exit = fadeOut()) {
                          Card(
                              colors = CardDefaults.cardColors(containerColor = ZenMoss),
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(bottom = 12.dp)
                          ) {
                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(14.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column {
                                      Text(
                                          text = "Steeping $activeSteepName...",
                                          color = PaperBg,
                                          fontWeight = FontWeight.Bold,
                                          fontFamily = FontFamily.Serif
                                      )
                                      Text(
                                          text = String.format("Ready in %02d:%02d", steepSecondsLeft / 60, steepSecondsLeft % 60),
                                          color = PaperBg.copy(alpha = 0.85f),
                                          fontSize = 12.sp
                                      )
                                  }
                                  TextButton(onClick = { steepSecondsLeft = 0 }) {
                                      Text("Done", color = PaperBg)
                                  }
                              }
                          }
                      }

                      LazyColumn(
                          verticalArrangement = Arrangement.spacedBy(14.dp),
                          contentPadding = PaddingValues(bottom = 24.dp)
                      ) {
                          items(ayurvedicManual) { recipe ->
                              HerbalRecipeCard(
                                  recipe = recipe,
                                  onStartSteep = {
                                      activeSteepName = recipe.name
                                      steepSecondsLeft = recipe.steepMinutes * 60
                                      triggerGentleHaptic(context, 50)
                                  }
                              )
                          }
                      }
                  }
              }

              @Composable
              fun HerbalRecipeCard(recipe: HerbalWater, onStartSteep: () -> Unit) {
                  var expanded by remember { mutableStateOf(false) }

                  Card(
                      colors = CardDefaults.cardColors(containerColor = ClaySurface),
                      shape = RoundedCornerShape(16.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .clickable { expanded = !expanded }
                  ) {
                      Column(modifier = Modifier.padding(18.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = recipe.name,
                                      fontSize = 17.sp,
                                      fontFamily = FontFamily.Serif,
                                      fontWeight = FontWeight.Bold,
                                      color = ZenMoss
                                  )
                                  Text(
                                      text = recipe.tamilName,
                                      fontSize = 12.sp,
                                      color = Terracotta,
                                      fontWeight = FontWeight.Medium
                                  )
                              }
                              Icon(
                                  imageVector = Icons.Default.Spa,
                                  contentDescription = null,
                                  tint = ZenMoss,
                                  modifier = Modifier.size(24.dp)
                              )
                          }
                          Spacer(modifier = Modifier.height(8.dp))
                          Text(
                              text = recipe.tagline,
                              fontSize = 13.sp,
                              fontWeight = FontWeight.SemiBold,
                              color = BrushInk
                          )
                          Spacer(modifier = Modifier.height(4.dp))
                          Text(
                              text = recipe.mindBodyBenefit,
                              fontSize = 12.sp,
                              color = MutedInk,
                              lineHeight = 18.sp
                          )

                          AnimatedVisibility(visible = expanded) {
                              Column(modifier = Modifier.padding(top = 12.dp)) {
                                  HorizontalDivider(color = MistSage.copy(alpha = 0.35f))
                                  Spacer(modifier = Modifier.height(10.dp))
                                  Text("Ingredients:", fontWeight = FontWeight.Bold, fontSize = 12.sp, color = BrushInk)
                                  Text(recipe.ingredients, fontSize = 12.sp, color = MutedInk)
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text("Preparation:", fontWeight = FontWeight.Bold, fontSize = 12.sp, color = BrushInk)
                                  Text(recipe.method, fontSize = 12.sp, color = MutedInk, lineHeight = 17.sp)
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text("Best Time: ${recipe.bestTime}", fontSize = 11.sp, fontStyle = FontStyle.Italic, color = ZenMoss, fontWeight = FontWeight.SemiBold)
                                  Spacer(modifier = Modifier.height(12.dp))
                                  OutlinedButton(
                                      onClick = onStartSteep,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(48.dp)
                                  ) {
                                      Text(
                                          text = "Start ${recipe.steepMinutes}-Min Steep Timer",
                                          color = ZenMoss,
                                          fontFamily = FontFamily.Serif
                                      )
                                  }
                              }
                          }
                          if (!expanded) {
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(
                                  text = "Tap for recipe & steep timer →",
                                  fontSize = 11.sp,
                                  color = ZenMoss,
                                  fontWeight = FontWeight.Medium
                              )
                          }
                      }
                  }
              }

              fun triggerGentleHaptic(context: Context, durationMs: Long) {
                  try {
                      val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(durationMs)
                      }
                  } catch (_: Exception) {}
              }

              fun playSoftZenBell() {
                  try {
                      val toneGen = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 40)
                      toneGen.startTone(ToneGenerator.TONE_PROP_BEEP, 220)
                  } catch (_: Exception) {}
              }
          """)
          PYEOF

      - name: Compile Android APK (Native JDK 17 & Android SDK)
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          gradle assembleDebug --no-daemon --no-build-cache
          cp app/build/outputs/apk/debug/app-debug.apk Neer-Zen.apk

      - name: Publish Direct APK to GitHub Releases (Native GH CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.2.${{ github.run_number }}" Neer-Zen.apk \
            --title "Neer Zen APK v1.2 (Build #${{ github.run_number }})" \
            --notes "Refactored with Impeccable Material 3, accessible touch targets, and authentic Sumi-e color theory."

name: Build Neer Zen APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neer-zen-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Neer Android project
        shell: bash
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          import textwrap

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")

          write("settings.gradle.kts", """
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "Neer"
              include(":app")
          """)

          write("build.gradle.kts", """
              plugins {
                  id("com.android.application") version "8.7.3" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              }
          """)

          write("gradle.properties", """
              org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
              org.gradle.parallel=true
              org.gradle.caching=true
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          write("app/build.gradle.kts", """
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }

              android {
                  namespace = "com.zen.neer"
                  compileSdk = 35
                  buildToolsVersion = "35.0.0"

                  defaultConfig {
                      applicationId = "com.zen.neer"
                      minSdk = 26
                      targetSdk = 35
                      versionCode = 4
                      versionName = "1.3"
                  }

                  buildTypes {
                      release {
                          isMinifyEnabled = false
                      }
                  }

                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions { jvmTarget = "17" }
                  buildFeatures { compose = true }
                  composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
                  packaging {
                      resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }

              dependencies {
                  val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
                  implementation(composeBom)
                  implementation("androidx.core:core-ktx:1.13.1")
                  implementation("androidx.activity:activity-compose:1.9.0")
                  implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
                  implementation("androidx.compose.ui:ui")
                  implementation("androidx.compose.ui:ui-graphics")
                  implementation("androidx.compose.ui:ui-tooling-preview")
                  implementation("androidx.compose.foundation:foundation")
                  implementation("androidx.compose.material3:material3")
                  implementation("androidx.compose.material:material-icons-extended")
                  debugImplementation("androidx.compose.ui:ui-tooling")
              }
          """)

          write("app/src/main/res/values/strings.xml", """
              <resources>
                  <string name="app_name">Neer Zen</string>
              </resources>
          """)

          write("app/src/main/AndroidManifest.xml", """
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.VIBRATE" />
                  <application
                      android:allowBackup="true"
                      android:label="@string/app_name"
                      android:supportsRtl="true"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          """)

          write("app/src/main/java/com/zen/neer/MainActivity.kt", """
              package com.zen.neer

              import android.content.Context
              import android.os.Bundle
              import androidx.activity.ComponentActivity
              import androidx.activity.compose.setContent
              import androidx.compose.animation.AnimatedContent
              import androidx.compose.animation.AnimatedVisibility
              import androidx.compose.animation.animateColorAsState
              import androidx.compose.animation.animateContentSize
              import androidx.compose.animation.core.FastOutSlowInEasing
              import androidx.compose.animation.core.LinearEasing
              import androidx.compose.animation.core.RepeatMode
              import androidx.compose.animation.core.animateFloat
              import androidx.compose.animation.core.animateFloatAsState
              import androidx.compose.animation.core.infiniteRepeatable
              import androidx.compose.animation.core.rememberInfiniteTransition
              import androidx.compose.animation.core.tween
              import androidx.compose.animation.fadeIn
              import androidx.compose.animation.fadeOut
              import androidx.compose.animation.slideInHorizontally
              import androidx.compose.animation.slideOutHorizontally
              import androidx.compose.animation.togetherWith
              import androidx.compose.foundation.Canvas
              import androidx.compose.foundation.background
              import androidx.compose.foundation.border
              import androidx.compose.foundation.clickable
              import androidx.compose.foundation.layout.*
              import androidx.compose.foundation.lazy.LazyColumn
              import androidx.compose.foundation.lazy.items
              import androidx.compose.foundation.rememberScrollState
              import androidx.compose.foundation.shape.CircleShape
              import androidx.compose.foundation.shape.RoundedCornerShape
              import androidx.compose.foundation.verticalScroll
              import androidx.compose.material.icons.Icons
              import androidx.compose.material.icons.rounded.Check
              import androidx.compose.material.icons.rounded.ChevronRight
              import androidx.compose.material.icons.rounded.MenuBook
              import androidx.compose.material.icons.rounded.Pause
              import androidx.compose.material.icons.rounded.PlayArrow
              import androidx.compose.material.icons.rounded.Refresh
              import androidx.compose.material.icons.rounded.SelfImprovement
              import androidx.compose.material.icons.rounded.Spa
              import androidx.compose.material.icons.rounded.WaterDrop
              import androidx.compose.material3.*
              import androidx.compose.runtime.*
              import androidx.compose.ui.Alignment
              import androidx.compose.ui.Modifier
              import androidx.compose.ui.draw.clip
              import androidx.compose.ui.draw.rotate
              import androidx.compose.ui.draw.scale
              import androidx.compose.ui.geometry.Offset
              import androidx.compose.ui.geometry.Size
              import androidx.compose.ui.graphics.Color
              import androidx.compose.ui.graphics.StrokeCap
              import androidx.compose.ui.graphics.drawscope.Stroke
              import androidx.compose.ui.hapticfeedback.HapticFeedbackType
              import androidx.compose.ui.platform.LocalContext
              import androidx.compose.ui.platform.LocalHapticFeedback
              import androidx.compose.ui.text.font.FontFamily
              import androidx.compose.ui.text.font.FontStyle
              import androidx.compose.ui.text.font.FontWeight
              import androidx.compose.ui.text.style.TextAlign
              import androidx.compose.ui.unit.dp
              import androidx.compose.ui.unit.sp
              import androidx.core.view.WindowCompat
              import kotlinx.coroutines.delay
              import java.util.Locale

              private val Paper = Color(0xFFF5F2EB)
              private val SurfaceWarm = Color(0xFFFFFDF8)
              private val SurfaceStone = Color(0xFFEBE5D8)
              private val Ink = Color(0xFF232924)
              private val Moss = Color(0xFF3A4F41)
              private val Sage = Color(0xFF8A9B8E)
              private val Clay = Color(0xFFB5654D)
              private val Muted = Color(0xFF5A635E)
              private val Hairline = Color(0xFFD9D4C9)

              private const val SIP_SECONDS = 5
              private const val PAUSE_SECONDS = 5
              private const val DAILY_GOAL = 8

              private enum class SipState { READY, SIP, PAUSE }

              private data class Infusion(
                  val name: String,
                  val tamil: String,
                  val note: String,
                  val ingredients: String,
                  val method: String,
                  val bestTime: String,
                  val minutes: Int
              )

              private val infusions = listOf(
                  Infusion("Jeera water", "சீரகத் தண்ணீர் · Seeraga neer",
                      "A simple, earthy everyday infusion.",
                      "1 tsp cumin seeds + 500 ml water",
                      "Simmer gently for 5 minutes. Cover, rest for 5 minutes, then strain.",
                      "Morning or after a meal", 5),
                  Infusion("Vendhaya water", "வெந்தயத் தண்ணீர் · Vendhaya neer",
                      "A traditional fenugreek infusion.",
                      "1 tsp fenugreek seeds + 1 glass water",
                      "Soak the seeds overnight in a clean covered vessel. Strain before drinking.",
                      "Morning", 10),
                  Infusion("Omam water", "ஓமத் தண்ணீர் · Oma neer",
                      "Warm, aromatic ajwain water.",
                      "½ tsp ajwain + 400 ml water",
                      "Lightly roast ajwain, add water and simmer for 4 minutes. Strain.",
                      "After a heavy meal", 4),
                  Infusion("Sombu water", "சோம்புத் தண்ணீர் · Sombu neer",
                      "A naturally aromatic fennel infusion.",
                      "1 tsp fennel seeds + 500 ml hot water",
                      "Pour hot water over the seeds, cover and steep for 7 minutes.",
                      "Late afternoon", 7),
                  Infusion("Vettiver water", "வெட்டிவேர் · Vettiver neer",
                      "A fragrant, traditional water infusion.",
                      "A small bundle of food-safe, thoroughly washed vetiver roots + 1 litre water",
                      "Infuse in a clean covered vessel for 2 hours. Discard roots after use.",
                      "Warm afternoons", 15)
              )

              class MainActivity : ComponentActivity() {
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      @Suppress("DEPRECATION")
                      window.statusBarColor = android.graphics.Color.rgb(245, 242, 235)
                      @Suppress("DEPRECATION")
                      window.navigationBarColor = android.graphics.Color.rgb(245, 242, 235)
                      val controller = WindowCompat.getInsetsController(window, window.decorView)
                      controller.isAppearanceLightStatusBars = true
                      controller.isAppearanceLightNavigationBars = true
                      setContent {
                          val scheme = lightColorScheme(
                              primary = Moss, onPrimary = SurfaceWarm,
                              secondary = Clay, onSecondary = SurfaceWarm,
                              background = Paper, onBackground = Ink,
                              surface = SurfaceWarm, onSurface = Ink,
                              surfaceVariant = SurfaceStone, onSurfaceVariant = Muted,
                              outline = Hairline
                          )
                          MaterialTheme(colorScheme = scheme, typography = Typography()) {
                              Surface(Modifier.fillMaxSize(), color = Paper) { NeerApp() }
                          }
                      }
                  }
              }

              @Composable
              private fun NeerApp() {
                  val context = LocalContext.current
                  val prefs = remember { context.getSharedPreferences("neer_zen_prefs", Context.MODE_PRIVATE) }
                  val today = remember { java.text.SimpleDateFormat("yyyy-MM-dd", Locale.US).format(java.util.Date()) }
                  var dayKey by remember { mutableStateOf(prefs.getString("pebbles_day", "") ?: "") }
                  var pebbles by remember {
                      mutableIntStateOf(if (dayKey == today) prefs.getInt("pebbles_count", 0) else 0)
                  }
                  var tab by remember { mutableIntStateOf(0) }

                  LaunchedEffect(today) {
                      if (dayKey != today) {
                          dayKey = today
                          pebbles = 0
                          prefs.edit().putString("pebbles_day", today).putInt("pebbles_count", 0).apply()
                      }
                  }

                  val completeSip: () -> Unit = {
                      pebbles += 1
                      prefs.edit().putString("pebbles_day", today).putInt("pebbles_count", pebbles).apply()
                  }
                  val resetPebbles: () -> Unit = {
                      pebbles = 0
                      prefs.edit().putString("pebbles_day", today).putInt("pebbles_count", 0).apply()
                  }

                  Scaffold(
                      containerColor = Paper,
                      bottomBar = {
                          NavigationBar(
                              containerColor = SurfaceWarm,
                              contentColor = Moss,
                              tonalElevation = 0.dp
                          ) {
                              NavigationBarItem(
                                  selected = tab == 0, onClick = { tab = 0 },
                                  icon = { Icon(Icons.Rounded.WaterDrop, contentDescription = null, modifier = Modifier.size(21.dp)) },
                                  label = { Text("Sip", fontSize = 11.sp) },
                                  colors = navColors()
                              )
                              NavigationBarItem(
                                  selected = tab == 1, onClick = { tab = 1 },
                                  icon = { Icon(Icons.Rounded.SelfImprovement, contentDescription = null, modifier = Modifier.size(21.dp)) },
                                  label = { Text("Focus", fontSize = 11.sp) },
                                  colors = navColors()
                              )
                              NavigationBarItem(
                                  selected = tab == 2, onClick = { tab = 2 },
                                  icon = { Icon(Icons.Rounded.MenuBook, contentDescription = null, modifier = Modifier.size(21.dp)) },
                                  label = { Text("Infusions", fontSize = 11.sp) },
                                  colors = navColors()
                              )
                          }
                      }
                  ) { padding ->
                      Box(Modifier.fillMaxSize().padding(padding)) {
                          AnimatedContent(
                              targetState = tab,
                              transitionSpec = {
                                  (fadeIn(tween(220)) + slideInHorizontally(
                                      animationSpec = tween(280, easing = FastOutSlowInEasing),
                                      initialOffsetX = { it / 18 }
                                  )) togetherWith
                                  (fadeOut(tween(140)) + slideOutHorizontally(
                                      animationSpec = tween(220), targetOffsetX = { -it / 24 }
                                  ))
                              },
                              label = "tab-transition"
                          ) { page ->
                              when (page) {
                                  0 -> SipScreen(pebbles, completeSip, resetPebbles)
                                  1 -> FocusScreen(completeSip)
                                  else -> InfusionsScreen()
                              }
                          }
                      }
                  }
              }

              @Composable
              private fun navColors() = NavigationBarItemDefaults.colors(
                  selectedIconColor = Moss,
                  selectedTextColor = Moss,
                  indicatorColor = Sage.copy(alpha = 0.22f),
                  unselectedIconColor = Muted.copy(alpha = 0.75f),
                  unselectedTextColor = Muted.copy(alpha = 0.85f)
              )

              @Composable
              private fun Eyebrow(text: String, modifier: Modifier = Modifier) {
                  Text(text.uppercase(), modifier = modifier, color = Muted,
                      fontSize = 10.sp, letterSpacing = 2.1.sp, fontWeight = FontWeight.SemiBold)
              }

              @Composable
              private fun ScreenTitle(title: String, subtitle: String) {
                  Column(verticalArrangement = Arrangement.spacedBy(5.dp)) {
                      Eyebrow("NEER  /  DAILY RITUAL")
                      Text(title, fontSize = 29.sp, lineHeight = 34.sp,
                          fontFamily = FontFamily.Serif, fontWeight = FontWeight.Medium, color = Ink)
                      Text(subtitle, fontSize = 13.sp, lineHeight = 19.sp, color = Muted)
                  }
              }

              @Composable
              private fun ProgressRing(
                  progress: Float,
                  color: Color,
                  size: androidx.compose.ui.unit.Dp,
                  modifier: Modifier = Modifier
              ) {
                  Canvas(modifier.size(size)) {
                      val stroke = 10.dp.toPx()
                      val inset = stroke / 2f
                      val arcSize = Size(this.size.width - stroke, this.size.height - stroke)
                      drawArc(
                          color = Hairline, startAngle = -90f, sweepAngle = 360f, useCenter = false,
                          topLeft = Offset(inset, inset), size = arcSize,
                          style = Stroke(width = stroke, cap = StrokeCap.Round)
                      )
                      if (progress > 0f) {
                          drawArc(
                              color = color, startAngle = -90f,
                              sweepAngle = 360f * progress.coerceIn(0f, 1f), useCenter = false,
                              topLeft = Offset(inset, inset), size = arcSize,
                              style = Stroke(width = stroke, cap = StrokeCap.Round)
                          )
                      }
                  }
              }

              @Composable
              private fun SipScreen(pebbles: Int, onSip: () -> Unit, onReset: () -> Unit) {
                  val haptic = LocalHapticFeedback.current
                  val latestOnSip by rememberUpdatedState(onSip)
                  var state by remember { mutableStateOf(SipState.READY) }
                  var secondsLeft by remember { mutableIntStateOf(0) }

                  LaunchedEffect(state) {
                      if (state == SipState.READY) return@LaunchedEffect
                      while (secondsLeft > 0) {
                          delay(1000)
                          secondsLeft -= 1
                      }
                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                      if (state == SipState.SIP) {
                          secondsLeft = PAUSE_SECONDS
                          state = SipState.PAUSE
                      } else {
                          latestOnSip()
                          state = SipState.READY
                      }
                  }

                  val total = if (state == SipState.SIP) SIP_SECONDS else PAUSE_SECONDS
                  val target = if (state == SipState.READY) 0f else 1f - secondsLeft / total.toFloat()
                  val progress by animateFloatAsState(
                      targetValue = target,
                      animationSpec = tween(1000, easing = LinearEasing),
                      label = "sip-ring"
                  )
                  val ringColor by animateColorAsState(
                      targetValue = when (state) {
                          SipState.READY -> Sage
                          SipState.SIP -> Moss
                          SipState.PAUSE -> Clay
                      },
                      animationSpec = tween(400),
                      label = "sip-color"
                  )
                  val pulse by rememberInfiniteTransition(label = "pulse").animateFloat(
                      initialValue = 1f,
                      targetValue = 1.035f,
                      animationSpec = infiniteRepeatable(
                          animation = tween(2400, easing = FastOutSlowInEasing),
                          repeatMode = RepeatMode.Reverse
                      ),
                      label = "pulse-scale"
                  )

                  Column(
                      Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 24.dp, vertical = 20.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.spacedBy(26.dp)
                  ) {
                      Box(Modifier.fillMaxWidth()) {
                          ScreenTitle("Sip slowly", "One mindful sip at a time. Each completed sip adds a pebble.")
                      }

                      Box(
                          Modifier.scale(if (state == SipState.READY) pulse else 1f),
                          contentAlignment = Alignment.Center
                      ) {
                          ProgressRing(progress = progress, color = ringColor, size = 220.dp)
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              when (state) {
                                  SipState.READY -> {
                                      Text("Ready", fontSize = 30.sp, fontFamily = FontFamily.Serif, color = Ink)
                                      Text("Take a slow sip", fontSize = 13.sp, color = Muted)
                                  }
                                  SipState.SIP -> {
                                      Text("$secondsLeft", fontSize = 48.sp, fontFamily = FontFamily.Serif, color = Ink)
                                      Text("Sip slowly", fontSize = 13.sp, color = Muted)
                                  }
                                  SipState.PAUSE -> {
                                      Text("$secondsLeft", fontSize = 48.sp, fontFamily = FontFamily.Serif, color = Ink)
                                      Text("Pause · breathe", fontSize = 13.sp, color = Muted)
                                  }
                              }
                          }
                      }

                      if (state == SipState.READY) {
                          Button(
                              onClick = {
                                  secondsLeft = SIP_SECONDS
                                  state = SipState.SIP
                              },
                              shape = RoundedCornerShape(16.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Moss, contentColor = SurfaceWarm),
                              modifier = Modifier.fillMaxWidth().height(52.dp)
                          ) {
                              Icon(Icons.Rounded.WaterDrop, contentDescription = null, modifier = Modifier.size(18.dp))
                              Spacer(Modifier.width(8.dp))
                              Text("Begin a sip", fontSize = 15.sp)
                          }
                      } else {
                          OutlinedButton(
                              onClick = {
                                  secondsLeft = 0
                                  state = SipState.READY
                              },
                              shape = RoundedCornerShape(16.dp),
                              modifier = Modifier.fillMaxWidth().height(52.dp)
                          ) {
                              Text("Stop", fontSize = 15.sp, color = Moss)
                          }
                      }

                      Column(
                          Modifier
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(20.dp))
                              .background(SurfaceWarm)
                              .border(1.dp, Hairline, RoundedCornerShape(20.dp))
                              .padding(18.dp),
                          verticalArrangement = Arrangement.spacedBy(12.dp)
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Rounded.Spa, contentDescription = null, tint = Sage, modifier = Modifier.size(18.dp))
                              Spacer(Modifier.width(8.dp))
                              Eyebrow("Today's pebbles", Modifier.weight(1f))
                              Text("$pebbles / $DAILY_GOAL", fontSize = 13.sp, color = Ink, fontWeight = FontWeight.Medium)
                          }
                          Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              repeat(DAILY_GOAL) { i ->
                                  val filled by animateColorAsState(
                                      targetValue = if (i < pebbles) Moss else SurfaceStone,
                                      animationSpec = tween(350),
                                      label = "pebble-$i"
                                  )
                                  Box(Modifier.size(20.dp).clip(CircleShape).background(filled))
                              }
                          }
                          if (pebbles > DAILY_GOAL) {
                              Text("Goal reached. ${pebbles - DAILY_GOAL} extra today.", fontSize = 12.sp, color = Muted)
                          }
                          TextButton(onClick = onReset, enabled = pebbles > 0) {
                              Icon(Icons.Rounded.Refresh, contentDescription = null, modifier = Modifier.size(16.dp), tint = Muted)
                              Spacer(Modifier.width(6.dp))
                              Text("Reset today", fontSize = 12.sp, color = Muted)
                          }
                      }
                  }
              }

              @Composable
              private fun FocusScreen(onComplete: () -> Unit) {
                  val haptic = LocalHapticFeedback.current
                  val latestOnComplete by rememberUpdatedState(onComplete)
                  var minutes by remember { mutableIntStateOf(3) }
                  var remaining by remember { mutableIntStateOf(180) }
                  var running by remember { mutableStateOf(false) }
                  var finished by remember { mutableStateOf(false) }

                  LaunchedEffect(running) {
                      if (!running) return@LaunchedEffect
                      while (remaining > 0) {
                          delay(1000)
                          remaining -= 1
                      }
                      running = false
                      finished = true
                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                      latestOnComplete()
                  }

                  val totalSeconds = minutes * 60f
                  val progress by animateFloatAsState(
                      targetValue = remaining / totalSeconds,
                      animationSpec = tween(1000, easing = LinearEasing),
                      label = "focus-ring"
                  )
                  val breathe by rememberInfiniteTransition(label = "breathe").animateFloat(
                      initialValue = 0.82f,
                      targetValue = 1f,
                      animationSpec = infiniteRepeatable(
                          animation = tween(4000, easing = FastOutSlowInEasing),
                          repeatMode = RepeatMode.Reverse
                      ),
                      label = "breathe-scale"
                  )
                  val clock = String.format(Locale.US, "%02d:%02d", remaining / 60, remaining % 60)

                  Column(
                      Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 24.dp, vertical = 20.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.spacedBy(26.dp)
                  ) {
                      Box(Modifier.fillMaxWidth()) {
                          ScreenTitle("Focus", "Breathe with the circle. A finished session adds a pebble.")
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          listOf(1, 3, 5).forEach { m ->
                              val selected = m == minutes
                              Box(
                                  Modifier
                                      .clip(RoundedCornerShape(50))
                                      .background(if (selected) Moss else SurfaceStone)
                                      .clickable(enabled = !running) {
                                          minutes = m
                                          remaining = m * 60
                                          finished = false
                                      }
                                      .padding(horizontal = 18.dp, vertical = 9.dp)
                              ) {
                                  Text(
                                      "$m min", fontSize = 13.sp,
                                      color = if (selected) SurfaceWarm else Muted,
                                      fontWeight = FontWeight.Medium
                                  )
                              }
                          }
                      }

                      Box(contentAlignment = Alignment.Center) {
                          ProgressRing(progress = progress, color = Moss, size = 240.dp)
                          Box(
                              Modifier
                                  .size(160.dp)
                                  .scale(if (running) breathe else 0.9f)
                                  .clip(CircleShape)
                                  .background(Sage.copy(alpha = 0.25f))
                          )
                          Text(clock, fontSize = 44.sp, fontFamily = FontFamily.Serif, color = Ink)
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp), modifier = Modifier.fillMaxWidth()) {
                          Button(
                              onClick = {
                                  if (remaining == 0) remaining = minutes * 60
                                  finished = false
                                  running = !running
                              },
                              shape = RoundedCornerShape(16.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Moss, contentColor = SurfaceWarm),
                              modifier = Modifier.weight(1f).height(52.dp)
                          ) {
                              Icon(
                                  if (running) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                                  contentDescription = null, modifier = Modifier.size(20.dp)
                              )
                              Spacer(Modifier.width(8.dp))
                              Text(if (running) "Pause" else "Start", fontSize = 15.sp)
                          }
                          OutlinedButton(
                              onClick = {
                                  running = false
                                  finished = false
                                  remaining = minutes * 60
                              },
                              shape = RoundedCornerShape(16.dp),
                              modifier = Modifier.height(52.dp)
                          ) {
                              Icon(Icons.Rounded.Refresh, contentDescription = "Reset", tint = Moss, modifier = Modifier.size(20.dp))
                          }
                      }

                      AnimatedVisibility(visible = finished, enter = fadeIn(tween(300)), exit = fadeOut(tween(200))) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Rounded.Check, contentDescription = null, tint = Moss, modifier = Modifier.size(18.dp))
                              Spacer(Modifier.width(8.dp))
                              Text("Session complete. One pebble added.", fontSize = 14.sp, color = Ink)
                          }
                      }
                  }
              }

              @Composable
              private fun Detail(label: String, value: String) {
                  Column(Modifier.padding(top = 12.dp), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                      Eyebrow(label)
                      Text(value, fontSize = 14.sp, lineHeight = 20.sp, color = Ink)
                  }
              }

              @Composable
              private fun InfusionCard(inf: Infusion, expanded: Boolean, onToggle: () -> Unit) {
                  val angle by animateFloatAsState(
                      targetValue = if (expanded) 90f else 0f,
                      animationSpec = tween(200),
                      label = "chevron"
                  )
                  Column(
                      Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(20.dp))
                          .background(SurfaceWarm)
                          .border(1.dp, Hairline, RoundedCornerShape(20.dp))
                          .clickable { onToggle() }
                          .animateContentSize()
                          .padding(18.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                              Text(inf.name, fontSize = 19.sp, fontFamily = FontFamily.Serif,
                                  fontWeight = FontWeight.Medium, color = Ink)
                              Text(inf.tamil, fontSize = 12.sp, color = Muted)
                          }
                          Icon(Icons.Rounded.ChevronRight, contentDescription = null, tint = Muted,
                              modifier = Modifier.size(22.dp).rotate(angle))
                      }
                      Text(inf.note, fontSize = 13.sp, fontStyle = FontStyle.Italic, color = Muted,
                          modifier = Modifier.padding(top = 8.dp))
                      AnimatedVisibility(visible = expanded) {
                          Column {
                              Detail("Ingredients", inf.ingredients)
                              Detail("Method", inf.method)
                              Detail("Best time", inf.bestTime)
                              Detail("Prep time", "${inf.minutes} min")
                          }
                      }
                  }
              }

              @Composable
              private fun InfusionsScreen() {
                  var expandedName by remember { mutableStateOf<String?>(null) }
                  LazyColumn(
                      Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(horizontal = 24.dp, vertical = 20.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      item {
                          Box(Modifier.padding(bottom = 8.dp)) {
                              ScreenTitle("Infusions", "Traditional Tamil home waters. Tap a card for details.")
                          }
                      }
                      items(infusions) { inf ->
                          InfusionCard(
                              inf = inf,
                              expanded = expandedName == inf.name,
                              onToggle = { expandedName = if (expandedName == inf.name) null else inf.name }
                          )
                      }
                      item {
                          Text(
                              "Traditional home preparations, not medical advice. Check with a doctor if you are pregnant, on medication, or have a health condition.",
                              fontSize = 11.sp, lineHeight = 16.sp, color = Muted, textAlign = TextAlign.Center,
                              modifier = Modifier.fillMaxWidth().padding(top = 6.dp, bottom = 8.dp)
                          )
                      }
                  }
              }
          """)
          PYEOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Neer-Zen-v1.3-build${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neer-Zen-APK
          path: Neer-Zen-v1.3-build${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release (download APK directly on mobile)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Neer Zen v1.3 (build ${{ github.run_number }})
          files: Neer-Zen-v1.3-build${{ github.run_number }}.apk
          make_latest: true

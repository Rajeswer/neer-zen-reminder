name: Build Neer Zen APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neer-zen-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Surface the real errors as annotations so they show on the run page (and on mobile).
            errs=$(grep -E '^e: |error: |ERROR:|AAPT: error' build.log | sed "s#file://$GITHUB_WORKSPACE/##; s#$GITHUB_WORKSPACE/##" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$errs" ] && echo "::error title=Compile errors::$errs"
            why=$(grep -A 15 'What went wrong' build.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$why" ] && echo "::error title=Gradle failure::$why"
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Neer-Zen-2.1-build${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neer-Zen-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Neer Zen 2.1 (build ${{ github.run_number }})
          body: Debug build of Neer Zen 2.1 from ${{ github.sha }}. Download the .apk below to install.
          files: dist/*.apk
          make_latest: true

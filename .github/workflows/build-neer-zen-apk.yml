name: Build Neer Zen APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neer-zen-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Neer Android project
        shell: bash
        run: |
          set -euo pipefail
          # Remove sources generated by older versions of this workflow so stale files can't break the build.
          rm -rf app/src/main/java/com/zen/neer
          mkdir -p app app/src/main app/src/main/java/com/zen/neer app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values

          cat > settings.gradle.kts <<'NEER_FILE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Neer"
          include(":app")
          NEER_FILE_EOF

          cat > build.gradle.kts <<'NEER_FILE_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          NEER_FILE_EOF

          cat > gradle.properties <<'NEER_FILE_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          NEER_FILE_EOF

          cat > app/build.gradle.kts <<'NEER_FILE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.zen.neer"
              compileSdk = 35
              buildToolsVersion = "35.0.0"

              defaultConfig {
                  applicationId = "com.zen.neer"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 6
                  versionName = "2.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          NEER_FILE_EOF

          cat > app/src/main/AndroidManifest.xml <<'NEER_FILE_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Neer">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          NEER_FILE_EOF

          cat > app/src/main/res/values/strings.xml <<'NEER_FILE_EOF'
          <resources>
              <string name="app_name">Neer Zen</string>
          </resources>
          NEER_FILE_EOF

          cat > app/src/main/res/values/colors.xml <<'NEER_FILE_EOF'
          <resources>
              <color name="neer_paper">#F5F2EB</color>
              <color name="neer_ink">#29332D</color>
              <color name="neer_clay">#B5654D</color>
          </resources>
          NEER_FILE_EOF

          cat > app/src/main/res/values/themes.xml <<'NEER_FILE_EOF'
          <resources>
              <style name="Theme.Neer" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/neer_paper</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          NEER_FILE_EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'NEER_FILE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M47,33 A22,22 0 1,1 33.5,62"
                  android:strokeColor="@color/neer_ink"
                  android:strokeWidth="6.5"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000" />
              <path
                  android:pathData="M54,44 C55.6,47.4 59,50.6 59,54.6 C59,57.6 56.8,59.6 54,59.6 C51.2,59.6 49,57.6 49,54.6 C49,50.6 52.4,47.4 54,44 Z"
                  android:fillColor="@color/neer_clay" />
          </vector>
          NEER_FILE_EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'NEER_FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/neer_paper" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          NEER_FILE_EOF

          cat > app/src/main/java/com/zen/neer/Theme.kt <<'NEER_FILE_EOF'
          package com.zen.neer

          import android.content.Context
          import android.provider.Settings
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.staticCompositionLocalOf
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          /** Centralised colour tokens — Sumi ink on washi paper. */
          internal object NeerColors {
              val Paper = Color(0xFFF5F2EB)
              val PaperDeep = Color(0xFFEDE8DD)
              val Stone = Color(0xFFEBE5D8)
              val SurfaceWarm = Color(0xFFFBF9F4)
              val Ink = Color(0xFF232924)
              val InkSoft = Color(0xFF3B433E)
              val Moss = Color(0xFF3A4F41)
              val Sage = Color(0xFF8A9B8E)
              val Clay = Color(0xFFB5654D)
              val ClayDeep = Color(0xFF9A5240)
              val Muted = Color(0xFF59625D)
              val Hairline = Color(0xFFD9D3C6)
              val Water = Color(0xFF6F9592)
              val WaterDeep = Color(0xFF2F4239)
              val WaterLight = Color(0xFFDDE9E2)
              val Granite = Color(0xFF7B776D)
              val GraniteDark = Color(0xFF5E5B53)
              val Bamboo = Color(0xFF8F9663)
              val BambooDark = Color(0xFF6B7148)
              val Night = Color(0xFF26231F)
          }

          internal val SerifFamily: FontFamily = FontFamily.Serif

          internal val NeerTypography = Typography(
              displaySmall = TextStyle(fontFamily = SerifFamily, fontWeight = FontWeight.Normal, fontSize = 34.sp, lineHeight = 40.sp),
              headlineMedium = TextStyle(fontFamily = SerifFamily, fontWeight = FontWeight.Normal, fontSize = 28.sp, lineHeight = 34.sp),
              headlineSmall = TextStyle(fontFamily = SerifFamily, fontWeight = FontWeight.Normal, fontSize = 23.sp, lineHeight = 29.sp),
              titleLarge = TextStyle(fontFamily = SerifFamily, fontWeight = FontWeight.Medium, fontSize = 20.sp, lineHeight = 26.sp),
              titleMedium = TextStyle(fontFamily = SerifFamily, fontWeight = FontWeight.Normal, fontSize = 17.sp, lineHeight = 23.sp),
              bodyLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontSize = 15.sp, lineHeight = 23.sp),
              bodyMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontSize = 14.sp, lineHeight = 21.sp),
              bodySmall = TextStyle(fontFamily = FontFamily.SansSerif, fontSize = 12.5.sp, lineHeight = 18.sp),
              labelLarge = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Medium, fontSize = 14.sp, lineHeight = 20.sp, letterSpacing = 0.3.sp),
              labelMedium = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.Medium, fontSize = 12.sp, lineHeight = 16.sp, letterSpacing = 0.4.sp),
              labelSmall = TextStyle(fontFamily = FontFamily.SansSerif, fontWeight = FontWeight.SemiBold, fontSize = 10.5.sp, lineHeight = 14.sp, letterSpacing = 1.8.sp)
          )

          /** Serif italic for whispered guidance and quotes. */
          internal val QuoteStyle = TextStyle(fontFamily = SerifFamily, fontStyle = FontStyle.Italic, fontSize = 15.sp, lineHeight = 22.sp)

          /** True when the system "Remove animations" / animator scale 0 setting is on. */
          internal val LocalReducedMotion = staticCompositionLocalOf { false }

          internal fun isReducedMotion(context: Context): Boolean = try {
              Settings.Global.getFloat(context.contentResolver, Settings.Global.ANIMATOR_DURATION_SCALE, 1f) == 0f
          } catch (e: Exception) {
              false
          }

          @Composable
          internal fun NeerTheme(reducedMotion: Boolean, content: @Composable () -> Unit) {
              val scheme = lightColorScheme(
                  primary = NeerColors.Moss, onPrimary = NeerColors.Paper,
                  secondary = NeerColors.ClayDeep, onSecondary = NeerColors.Paper,
                  background = NeerColors.Paper, onBackground = NeerColors.Ink,
                  surface = NeerColors.SurfaceWarm, onSurface = NeerColors.Ink,
                  surfaceVariant = NeerColors.Stone, onSurfaceVariant = NeerColors.Muted,
                  outline = NeerColors.Hairline, outlineVariant = NeerColors.Hairline
              )
              CompositionLocalProvider(LocalReducedMotion provides reducedMotion) {
                  MaterialTheme(colorScheme = scheme, typography = NeerTypography, content = content)
              }
          }
          NEER_FILE_EOF

          cat > app/src/main/java/com/zen/neer/Store.kt <<'NEER_FILE_EOF'
          package com.zen.neer

          import android.content.Context
          import androidx.compose.runtime.Stable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableLongStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          internal val FOCUS_PRESETS = listOf(15, 25, 45)
          internal const val DAILY_GOAL = 8

          /**
           * Local, offline persistence. Keeps the original "neer_zen_prefs" file and the
           * "pebbles_day" / "pebbles_count" keys so existing users keep today's stones.
           */
          internal class NeerStore(context: Context) {
              private val prefs = context.getSharedPreferences("neer_zen_prefs", Context.MODE_PRIVATE)

              private fun today(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())

              fun loadPebbles(): Int {
                  val day = prefs.getString(KEY_DAY, "") ?: ""
                  return if (day == today()) prefs.getInt(KEY_COUNT, 0).coerceAtLeast(0) else 0
              }

              fun savePebbles(count: Int) {
                  prefs.edit().putString(KEY_DAY, today()).putInt(KEY_COUNT, count.coerceAtLeast(0)).apply()
              }

              fun focusMinutes(): Int {
                  val m = prefs.getInt(KEY_FOCUS_MIN, 25)
                  return if (m in FOCUS_PRESETS) m else 25
              }

              fun focusMode(): FocusMode {
                  val name = prefs.getString(KEY_FOCUS_MODE, null) ?: return FocusMode.Idle
                  return FocusMode.values().firstOrNull { it.name == name } ?: FocusMode.Idle
              }

              fun focusEndAt(): Long = prefs.getLong(KEY_FOCUS_END, 0L)
              fun focusRemaining(): Long = prefs.getLong(KEY_FOCUS_REMAIN, 0L)

              fun saveFocus(minutes: Int, mode: FocusMode, endAt: Long, remaining: Long) {
                  prefs.edit()
                      .putInt(KEY_FOCUS_MIN, minutes)
                      .putString(KEY_FOCUS_MODE, mode.name)
                      .putLong(KEY_FOCUS_END, endAt)
                      .putLong(KEY_FOCUS_REMAIN, remaining)
                      .apply()
              }

              fun steepIndex(): Int = prefs.getInt(KEY_STEEP_INDEX, -1)
              fun steepEndAt(): Long = prefs.getLong(KEY_STEEP_END, 0L)
              fun steepTotal(): Long = prefs.getLong(KEY_STEEP_TOTAL, 0L)
              fun steepDone(): Boolean = prefs.getBoolean(KEY_STEEP_DONE, false)

              fun saveSteep(index: Int, endAt: Long, total: Long, done: Boolean) {
                  prefs.edit()
                      .putInt(KEY_STEEP_INDEX, index)
                      .putLong(KEY_STEEP_END, endAt)
                      .putLong(KEY_STEEP_TOTAL, total)
                      .putBoolean(KEY_STEEP_DONE, done)
                      .apply()
              }

              companion object {
                  private const val KEY_DAY = "pebbles_day"
                  private const val KEY_COUNT = "pebbles_count"
                  private const val KEY_FOCUS_MIN = "focus_minutes"
                  private const val KEY_FOCUS_MODE = "focus_mode"
                  private const val KEY_FOCUS_END = "focus_end_at"
                  private const val KEY_FOCUS_REMAIN = "focus_remaining_ms"
                  private const val KEY_STEEP_INDEX = "steep_index"
                  private const val KEY_STEEP_END = "steep_end_at"
                  private const val KEY_STEEP_TOTAL = "steep_total_ms"
                  private const val KEY_STEEP_DONE = "steep_done"
              }
          }

          internal enum class FocusMode { Idle, Running, Paused, Complete }

          /**
           * Focus timer driven by wall-clock end time, so it survives tab switches,
           * rotation and process death. Completion can only happen once per run.
           */
          @Stable
          internal class FocusTimer(private val store: NeerStore) {
              var minutes by mutableIntStateOf(store.focusMinutes())
                  private set
              var mode by mutableStateOf(store.focusMode())
                  private set
              var endAt by mutableLongStateOf(store.focusEndAt())
                  private set
              private var pausedRemaining by mutableLongStateOf(store.focusRemaining())

              /** Updated by the ticker; drives the visible countdown. */
              var now by mutableLongStateOf(System.currentTimeMillis())

              val totalMs: Long get() = minutes * 60_000L

              val remainingMs: Long
                  get() = when (mode) {
                      FocusMode.Idle -> totalMs
                      FocusMode.Running -> (endAt - now).coerceIn(0L, totalMs)
                      FocusMode.Paused -> pausedRemaining.coerceIn(0L, totalMs)
                      FocusMode.Complete -> 0L
                  }

              fun select(newMinutes: Int) {
                  if (mode != FocusMode.Idle || newMinutes !in FOCUS_PRESETS) return
                  minutes = newMinutes
                  persist()
              }

              fun start() {
                  if (mode == FocusMode.Running || mode == FocusMode.Complete) return
                  val t = System.currentTimeMillis()
                  val length = if (mode == FocusMode.Paused) pausedRemaining.coerceIn(1L, totalMs) else totalMs
                  now = t
                  endAt = t + length
                  mode = FocusMode.Running
                  persist()
              }

              fun pause() {
                  if (mode != FocusMode.Running) return
                  val t = System.currentTimeMillis()
                  pausedRemaining = (endAt - t).coerceAtLeast(0L)
                  now = t
                  mode = FocusMode.Paused
                  persist()
              }

              fun reset() {
                  mode = FocusMode.Idle
                  persist()
              }

              /** Returns true only for the single transition Running -> Complete. */
              fun tryComplete(): Boolean {
                  if (mode != FocusMode.Running) return false
                  mode = FocusMode.Complete
                  persist()
                  return true
              }

              fun finishBreak() {
                  if (mode != FocusMode.Complete) return
                  mode = FocusMode.Idle
                  persist()
              }

              private fun persist() = store.saveFocus(minutes, mode, endAt, pausedRemaining)
          }

          /** Steep timer for an infusion recipe; persisted so long steeps survive the app closing. */
          @Stable
          internal class SteepTim